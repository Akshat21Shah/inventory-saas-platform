components:
  schemas:
    ActorTypeEnum:
      enum:
      - PLATFORM
      - STAFF
      - RETAILER
      - SYSTEM
      type: string
      description: |-
        * `PLATFORM` - Platform
        * `STAFF` - Staff
        * `RETAILER` - Retailer
        * `SYSTEM` - System
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AddressKindEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        line1:
          type: string
          readOnly: true
        line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        pincode:
          type: string
          readOnly: true
        state_code:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
      required:
      - city
      - district
      - id
      - is_default
      - kind
      - label
      - line1
      - line2
      - pincode
      - state_code
    AddressKindEnum:
      enum:
      - BILLING
      - SHIPPING
      type: string
      description: |-
        * `BILLING` - Billing
        * `SHIPPING` - Shipping
    AddressWriteRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          default: ''
          maxLength: 60
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          default: ''
          maxLength: 100
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        state_code:
          type: string
          minLength: 1
          maxLength: 2
        is_default:
          type: boolean
          nullable: true
      required:
      - city
      - kind
      - line1
      - pincode
      - state_code
    AppliedDiscount:
      type: object
      properties:
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        discount_type:
          type: string
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        slab_min_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - amount
      - discount_type
      - rule_id
      - rule_name
      - slab_min_qty
      - value
    AssetUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    AudienceTypeEnum:
      enum:
      - ALL
      - PRICE_LIST
      - RETAILER
      type: string
      description: |-
        * `ALL` - All shops
        * `PRICE_LIST` - Shops on a price list
        * `RETAILER` - One shop
    AuditActor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          nullable: true
      required:
      - email
      - full_name
      - id
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          allOf:
          - $ref: '#/components/schemas/AuditTenant'
          nullable: true
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
          readOnly: true
        actor_type:
          $ref: '#/components/schemas/ActorTypeEnum'
        impersonator:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
          readOnly: true
        impersonation_session_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          maxLength: 80
        target_type:
          type: string
          maxLength: 80
        target_id:
          type: string
          maxLength: 64
        target_repr:
          type: string
          maxLength: 200
        changes: {}
        metadata: {}
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
        request_id:
          type: string
          maxLength: 64
      required:
      - action
      - actor
      - actor_type
      - created_at
      - id
      - impersonator
      - tenant
    AuditTenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    BankDetails:
      type: object
      properties:
        bank_account_name:
          type: string
          maxLength: 200
        bank_account_number_masked:
          type: string
          readOnly: true
        bank_ifsc:
          type: string
          maxLength: 11
        bank_name:
          type: string
          maxLength: 120
        bank_branch:
          type: string
          maxLength: 120
        upi_id:
          type: string
          maxLength: 320
      required:
      - bank_account_name
      - bank_account_number_masked
      - bank_branch
      - bank_ifsc
      - bank_name
      - upi_id
    BankDetailsInputRequest:
      type: object
      properties:
        bank_account_name:
          type: string
          maxLength: 200
        bank_account_number:
          type: string
          writeOnly: true
          maxLength: 20
        bank_ifsc:
          type: string
          maxLength: 11
        bank_name:
          type: string
          maxLength: 120
        bank_branch:
          type: string
          maxLength: 120
        upi_id:
          type: string
          maxLength: 320
    Barcode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        barcode:
          type: string
          maxLength: 64
      required:
      - barcode
      - id
    BarcodeRequest:
      type: object
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - barcode
    BillingAddressRequest:
      type: object
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          default: ''
          maxLength: 100
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        state_code:
          type: string
          minLength: 1
          maxLength: 2
      required:
      - city
      - line1
      - pincode
      - state_code
    BlockRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - reason
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        own_brand:
          type: boolean
      required:
      - id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        own_brand:
          type: boolean
      required:
      - name
    Branding:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 120
        primary_color:
          type: string
          maxLength: 7
        logo_url:
          type: string
          readOnly: true
          nullable: true
        favicon_url:
          type: string
          readOnly: true
          nullable: true
        app_icon_url:
          type: string
          readOnly: true
          nullable: true
      required:
      - app_icon_url
      - display_name
      - favicon_url
      - logo_url
      - primary_color
    BulkActionEnum:
      enum:
      - activate
      - deactivate
      - show_in_shop
      - hide_from_shop
      - set_category
      - set_brand
      type: string
      description: |-
        * `activate` - activate
        * `deactivate` - deactivate
        * `show_in_shop` - show_in_shop
        * `hide_from_shop` - hide_from_shop
        * `set_category` - set_category
        * `set_brand` - set_brand
    BulkRequest:
      type: object
      properties:
        product_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        action:
          $ref: '#/components/schemas/BulkActionEnum'
        value:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - product_ids
    BulkResult:
      type: object
      properties:
        changed:
          type: integer
      required:
      - changed
    BulkScheduleRequest:
      type: object
      properties:
        gst_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
        cess_type:
          type: string
          format: uuid
          nullable: true
        cess_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          default: '0.000'
        effective_from:
          type: string
