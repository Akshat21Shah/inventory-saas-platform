  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: target_id
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - in: query
        name: target_type
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - in: query
        name: tenant_id
        schema:
          type: string
          format: uuid
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      tags:
      - settings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
