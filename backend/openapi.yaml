  /api/v1/webhooks/payments/{provider}/{token}/:
    post:
      operationId: payment_webhook
      description: 'Public: authenticated by the gateway''s signature, with the distributor''s
        webhook secret.'
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
