components:
  schemas:
    AdditionRequest:
      type: object
      properties:
        product:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - product
      - quantity
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AddressKindEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        line1:
          type: string
          readOnly: true
        line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        pincode:
          type: string
          readOnly: true
        state_code:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
      required:
      - city
      - district
      - id
      - is_default
      - kind
      - label
      - line1
      - line2
      - pincode
      - state_code
    AddressKindEnum:
      enum:
      - BILLING
      - SHIPPING
      type: string
      description: |-
        * `BILLING` - Billing
        * `SHIPPING` - Shipping
    AddressWriteRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          default: ''
          maxLength: 60
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          default: ''
          maxLength: 100
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        state_code:
          type: string
          minLength: 1
          maxLength: 2
        is_default:
          type: boolean
          nullable: true
      required:
      - city
      - kind
      - line1
      - pincode
      - state_code
    AdjustApplyRequest:
      type: object
      properties:
        percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        category:
          type: string
          format: uuid
          nullable: true
        brand:
          type: string
          format: uuid
          nullable: true
        include_missing:
          type: boolean
          default: false
        rounding:
          allOf:
          - $ref: '#/components/schemas/RoundingEnum'
          default: PAISA
        expected_count:
          type: integer
          minimum: 0
      required:
      - expected_count
      - percent
    AdjustPreview:
      type: object
      properties:
        count:
          type: integer
        added:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PriceChange'
          description: The first 200 changes.
      required:
      - added
      - count
      - rows
    AdjustRequest:
      type: object
      properties:
        percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        category:
          type: string
          format: uuid
          nullable: true
        brand:
          type: string
          format: uuid
          nullable: true
        include_missing:
          type: boolean
          default: false
        rounding:
          allOf:
          - $ref: '#/components/schemas/RoundingEnum'
          default: PAISA
      required:
      - percent
    AdjustResult:
      type: object
      properties:
        changed:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      required:
      - changed
      - warnings
    Adjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
        reason_code:
          allOf:
          - $ref: '#/components/schemas/ReasonCodeEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        line_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - line_count
      - note
      - number
      - reason_code
    AdjustmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
        reason_code:
          allOf:
          - $ref: '#/components/schemas/ReasonCodeEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        line_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentLine'
          readOnly: true
        unchanged:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - line_count
      - lines
      - note
      - number
      - reason_code
      - unchanged
    AdjustmentInputRequest:
      type: object
      properties:
        reason_code:
          $ref: '#/components/schemas/ReasonCodeEnum'
        note:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentLineInputRequest'
      required:
      - lines
      - note
      - reason_code
    AdjustmentLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        line_no:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/StockProductRef'
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/AdjustmentModeEnum'
          readOnly: true
        entered_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        quantity_change:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
