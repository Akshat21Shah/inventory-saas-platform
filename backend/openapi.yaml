    FeatureFlag:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        default_enabled:
          type: boolean
        tenant_toggleable:
          type: boolean
      required:
