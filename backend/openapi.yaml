components:
  schemas:
    ActionEnum:
      enum:
      - activate
      - deactivate
      - show_in_shop
      - hide_from_shop
      - set_category
      - set_brand
      type: string
      description: |-
        * `activate` - activate
        * `deactivate` - deactivate
        * `show_in_shop` - show_in_shop
        * `hide_from_shop` - hide_from_shop
        * `set_category` - set_category
        * `set_brand` - set_brand
    ActorTypeEnum:
      enum:
      - PLATFORM
      - STAFF
      - RETAILER
      - SYSTEM
      type: string
      description: |-
        * `PLATFORM` - Platform
        * `STAFF` - Staff
        * `RETAILER` - Retailer
        * `SYSTEM` - System
    AssetUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    AuditActor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          nullable: true
      required:
      - email
      - full_name
      - id
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          allOf:
          - $ref: '#/components/schemas/AuditTenant'
          nullable: true
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
          readOnly: true
        actor_type:
          $ref: '#/components/schemas/ActorTypeEnum'
        impersonator:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          nullable: true
          readOnly: true
        impersonation_session_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          maxLength: 80
        target_type:
          type: string
          maxLength: 80
        target_id:
          type: string
          maxLength: 64
        target_repr:
          type: string
          maxLength: 200
        changes: {}
        metadata: {}
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
        request_id:
          type: string
          maxLength: 64
      required:
      - action
      - actor
      - actor_type
      - created_at
      - id
      - impersonator
      - tenant
    AuditTenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    BankDetails:
      type: object
      properties:
        bank_account_name:
          type: string
          maxLength: 200
        bank_account_number_masked:
          type: string
          readOnly: true
        bank_ifsc:
          type: string
          maxLength: 11
        bank_name:
          type: string
          maxLength: 120
        bank_branch:
          type: string
          maxLength: 120
        upi_id:
          type: string
          maxLength: 320
      required:
      - bank_account_name
      - bank_account_number_masked
      - bank_branch
      - bank_ifsc
      - bank_name
      - upi_id
    BankDetailsInputRequest:
      type: object
      properties:
        bank_account_name:
          type: string
          maxLength: 200
        bank_account_number:
          type: string
          writeOnly: true
          maxLength: 20
        bank_ifsc:
          type: string
          maxLength: 11
        bank_name:
          type: string
          maxLength: 120
        bank_branch:
          type: string
          maxLength: 120
        upi_id:
          type: string
          maxLength: 320
    Barcode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        barcode:
          type: string
          maxLength: 64
      required:
      - barcode
      - id
    BarcodeRequest:
      type: object
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - barcode
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    Branding:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 120
        primary_color:
          type: string
          maxLength: 7
        logo_url:
          type: string
          readOnly: true
          nullable: true
        favicon_url:
          type: string
          readOnly: true
          nullable: true
        app_icon_url:
          type: string
          readOnly: true
          nullable: true
      required:
      - app_icon_url
      - display_name
      - favicon_url
      - logo_url
      - primary_color
    BulkRequest:
      type: object
      properties:
        product_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        action:
          $ref: '#/components/schemas/ActionEnum'
        value:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - product_ids
    BulkResult:
      type: object
      properties:
        changed:
          type: integer
      required:
      - changed
    BulkScheduleRequest:
      type: object
      properties:
        gst_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
        cess_type:
          type: string
          format: uuid
          nullable: true
        cess_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          default: '0.000'
        effective_from:
          type: string
          format: date
        reason:
          type: string
          default: ''
          maxLength: 200
        hsn_prefix:
          type: string
          minLength: 1
          default: ''
          pattern: ^[0-9]{2,8}$
        category:
          type: string
          format: uuid
          nullable: true
        product_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5000
        preview:
          type: boolean
          default: true
        expected_count:
          type: integer
          minimum: 0
      required:
      - effective_from
      - gst_rate
    BulkScheduleResult:
      type: object
      properties:
        count:
          type: integer
        skipped:
          type: integer
        sample:
          type: array
          items:
            type: object
            additionalProperties: {}
        committed:
          type: boolean
      required:
      - committed
      - count
    Business:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        legal_name:
          type: string
          maxLength: 200
        gstin:
          type: string
          maxLength: 30
        pan:
          type: string
          readOnly: true
          maxLength: 10
        state_code:
          type: string
          maxLength: 2
        registration_type:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Changed only by the platform team.
        address_line1:
          type: string
          maxLength: 200
        address_line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        pincode:
          type: string
          maxLength: 6
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 16
        invoice_terms:
          type: string
        invoice_footer:
          type: string
        signatory_name:
          type: string
          maxLength: 150
        has_signatory_image:
          type: boolean
          readOnly: true
      required:
      - address_line1
      - address_line2
      - city
      - email
      - gstin
      - has_signatory_image
      - invoice_footer
      - invoice_terms
      - legal_name
      - name
      - pan
      - phone
      - pincode
      - registration_type
      - signatory_name
      - slug
      - state_code
    CalcMethodEnum:
      enum:
      - PERCENT
      - SPECIFIC_PER_UNIT
      type: string
      description: |-
        * `PERCENT` - Percentage of taxable value
        * `SPECIFIC_PER_UNIT` - Fixed amount per unit (reserved)
    CancelRateRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - reason
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        level:
          type: integer
          readOnly: true
        sort_order:
          type: integer
          readOnly: true
      required:
      - id
      - level
      - name
      - parent_id
      - slug
      - sort_order
    CategoryTreeNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
        sort_order:
          type: integer
        children:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - children
      - id
      - level
      - name
      - sort_order
    CategoryWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        parent_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
          default: 0
      required:
      - name
    CessType:
