    AdditionRequest:
      type: object
      properties:
        product:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - product
      - quantity
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
