    OrderRow:
      type: object
      description: A row on the order board.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        items_to_follow:
          type: integer
          readOnly: true
        backorder_state:
          allOf:
          - $ref: '#/components/schemas/BackorderStateEnum'
          readOnly: true
        hold_reason:
          readOnly: true
          description: |-
            Why it waits for approval; blank when it doesn't.

            * `CREDIT_LIMIT` - Over the credit limit
            * `OVERDUE` - Overdue invoices
          oneOf:
          - $ref: '#/components/schemas/HoldReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        retailer:
          type: string
          format: uuid
          readOnly: true
        retailer_name:
          type: string
          readOnly: true
        placed_via:
          allOf:
          - $ref: '#/components/schemas/PlacedViaEnum'
          readOnly: true
        placed_by_label:
          type: string
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        line_count:
          type: integer
          readOnly: true
      required:
      - backorder_state
      - grand_total
      - hold_reason
      - id
      - items_to_follow
      - line_count
      - number
      - placed_at
      - placed_by_label
      - placed_via
      - retailer
      - retailer_name
      - status
    OrderStatusEnum:
      enum:
      - PLACED
      - ON_HOLD
      - ACCEPTED
      - PACKED
      - DISPATCHED
      - PARTLY_DELIVERED
      - COMPLETED
      - REJECTED
      - CANCELLED
      type: string
      description: |-
        * `PLACED` - Placed
        * `ON_HOLD` - On hold
        * `ACCEPTED` - Accepted
        * `PACKED` - Packed
        * `DISPATCHED` - Dispatched
        * `PARTLY_DELIVERED` - Partly delivered
        * `COMPLETED` - Completed
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
    OrdersDay:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          description: Incl. GST.
      required:
      - count
      - date
      - value
