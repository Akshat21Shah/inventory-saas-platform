  /api/v1/discount-rules/export/:
    get:
      operationId: discount_rules_export
      description: Same columns as the import template, so a file can go out, be edited
        and come back.
      parameters:
      - in: query
        name: file_type
        schema:
          enum:
          - xlsx
          - csv
          type: string
          default: xlsx
          minLength: 1
        description: |-
          * `xlsx` - xlsx
          * `csv` - csv
      tags:
      - imports
      security:
      - jwtAuth: []
