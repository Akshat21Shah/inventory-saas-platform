          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 120
        calc_method:
          $ref: '#/components/schemas/CalcMethodEnum'
        is_active:
          type: boolean
      required:
      - code
      - id
      - name
    CessTypeRequest:
