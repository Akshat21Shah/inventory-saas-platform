        kind:
          allOf:
          - $ref: '#/components/schemas/AddressKindEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        line1:
          type: string
          readOnly: true
        line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        pincode:
          type: string
          readOnly: true
        state_code:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        distance_km:
          type: integer
          readOnly: true
          nullable: true
      required:
      - city
      - distance_km
      - district
      - id
      - is_default
      - kind
      - label
      - line1
      - line2
      - pincode
      - state_code
