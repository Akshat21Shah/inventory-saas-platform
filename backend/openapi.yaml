          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - gstin
      - id
      - name
      - plan
      - slug
      - state_code
      - status
    TenantOwner:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
        status:
          type: string
      required:
      - email
      - full_name
      - status
    TenantStatusEnum:
      enum:
      - ONBOARDING
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ONBOARDING` - Onboarding
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
    TenantUsage:
      type: object
      properties:
        staff:
          type: integer
        retailers:
          type: integer
        pending_invitations:
          type: integer
      required:
      - pending_invitations
      - retailers
      - staff
    TokenResponse:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh:
          type: string
          description: Only when the request sent one.
      required:
      - access
      - access_expires_at
    Unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 60
        allows_decimal:
          type: boolean
        uqc:
          type: string
          maxLength: 10
        is_active:
          type: boolean
      required:
      - code
      - id
      - name
      - uqc
    UnitWriteRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 60
        allows_decimal:
          type: boolean
          default: false
        uqc:
          type: string
          minLength: 1
          maxLength: 10
        is_active:
          type: boolean
          default: true
      required:
      - code
      - name
      - uqc
    UserTypeEnum:
      enum:
      - PLATFORM
      - STAFF
      - RETAILER
      type: string
      description: |-
        * `PLATFORM` - Platform
        * `STAFF` - Distributor staff
        * `RETAILER` - Retailer
    Warning:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
