    OrderRow:
      type: object
      description: A row on the order board.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        backorder_state:
          allOf:
          - $ref: '#/components/schemas/BackorderStateEnum'
          readOnly: true
        hold_reason:
          allOf:
          - $ref: '#/components/schemas/HoldReasonEnum'
          readOnly: true
        retailer:
          type: string
          format: uuid
          readOnly: true
        retailer_name:
          type: string
          readOnly: true
        placed_via:
          allOf:
          - $ref: '#/components/schemas/PlacedViaEnum'
          readOnly: true
        placed_by_label:
          type: string
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        line_count:
          type: integer
          readOnly: true
      required:
      - backorder_state
      - grand_total
      - hold_reason
      - id
      - line_count
      - number
      - placed_at
      - placed_by_label
      - placed_via
      - retailer
      - retailer_name
      - status
    OrderStatusEnum:
      enum:
      - PLACED
      - ON_HOLD
      - ACCEPTED
      - PACKED
      - DISPATCHED
      - DELIVERED
      - COMPLETED
      - REJECTED
      - CANCELLED
      type: string
      description: |-
        * `PLACED` - Placed
        * `ON_HOLD` - On hold
        * `ACCEPTED` - Accepted
        * `PACKED` - Packed
        * `DISPATCHED` - Dispatched
        * `DELIVERED` - Delivered
        * `COMPLETED` - Completed
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
    OutcomeEnum:
      enum:
      - OK
      - NEEDS_APPROVAL
      - BLOCKED
      type: string
      description: |-
        * `OK` - OK
        * `NEEDS_APPROVAL` - NEEDS_APPROVAL
        * `BLOCKED` - BLOCKED
    PackRequest:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineQuantityRequest'
          description: Packed quantity per shipment line; lines left out are packed
            in full.
