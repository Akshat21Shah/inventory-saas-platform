openapi: 3.0.3
info:
  title: Inventory Platform API
  version: 1.0.0
  description: Multi-tenant B2B inventory & ordering platform. All money values are
    decimal strings.
paths:
  /api/v1/auth/handoff/exchange/:
    post:
      operationId: auth_handoff_exchange
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffExchangeInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitation_accept
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/invitations/preview/:
    post:
      operationId: auth_invitation_preview
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInputRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/mfa/confirm/:
    post:
      operationId: auth_mfa_confirm
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSetupConfirmInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/mfa/disable/:
    post:
      operationId: auth_mfa_disable
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordAndFactorInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/recovery-codes/:
    post:
      operationId: auth_mfa_recovery_codes
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordAndFactorInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/mfa/setup/:
    post:
      operationId: auth_mfa_setup
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotInputRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInputRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/retailer/choose-account/:
    post:
      operationId: auth_retailer_choose_account
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetailerChooseAccountInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/retailer/otp/request/:
    post:
      operationId: auth_retailer_otp_request
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetailerOtpRequestInputRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailerOtpRequestResponse'
          description: ''
  /api/v1/auth/retailer/otp/verify/:
    post:
      operationId: auth_retailer_otp_verify
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetailerOtpVerifyInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/staff/choose-tenant/:
    post:
      operationId: auth_staff_choose_tenant
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChooseTenantInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/staff/login/:
    post:
      operationId: auth_staff_login
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/staff/mfa/enrol/confirm/:
    post:
      operationId: auth_staff_mfa_enrol_confirm
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolmentConfirmInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/staff/mfa/enrol/start/:
    post:
      operationId: auth_staff_mfa_enrol_start
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolmentTokenInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSecret'
          description: ''
  /api/v1/auth/staff/mfa/verify/:
    post:
      operationId: auth_staff_mfa_verify
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      description: No authentication, any caller; and no request-wide transaction
        (see module docstring).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInputRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/meta/:
    get:
      operationId: meta_retrieve
      tags:
      - meta
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: ''
  /api/v1/permissions/:
    get:
      operationId: permissions_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
          description: ''
  /api/v1/roles/:
    get:
      operationId: roles_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/staff/:
    get:
      operationId: staff_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
  /api/v1/staff/{membership_id}/:
    get:
      operationId: staff_retrieve
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    patch:
      operationId: staff_update
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/staff/invitations/:
    get:
      operationId: staff_invitations_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: staff_invitations_create
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/staff/invitations/{invitation_id}/resend/:
    post:
      operationId: staff_invitations_resend
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/staff/invitations/{invitation_id}/revoke/:
    post:
      operationId: staff_invitations_revoke
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
components:
  schemas:
    ChooseTenantInputRequest:
      type: object
      properties:
        choice_token:
          type: string
          minLength: 1
          maxLength: 200
        tenant_id:
          type: string
          format: uuid
      required:
      - choice_token
      - tenant_id
    EnrolmentConfirmInputRequest:
      type: object
      properties:
        enrolment_token:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
      - enrolment_token
    EnrolmentTokenInputRequest:
      type: object
      properties:
        enrolment_token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - enrolment_token
    Handoff:
      type: object
      properties:
        code:
          type: string
        tenant_slug:
          type: string
      required:
      - code
      - tenant_slug
    HandoffExchangeInputRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - code
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleRef'
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
        invited_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
      - status
    InvitationAcceptRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        full_name:
          type: string
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - password
      - token
    InvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role_code:
          type: string
          minLength: 1
          maxLength: 40
      required:
      - email
      - role_code
    InvitationPreview:
      type: object
      properties:
        tenant_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleRef'
        invited_by:
          type: string
        existing_account:
          type: boolean
          description: 'True: ask for the existing password instead of creating one.'
        expires_at:
          type: string
          format: date-time
      required:
      - email
      - existing_account
      - expires_at
      - invited_by
      - role
      - tenant_name
    InvitationTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - token
    LoginResponse:
      type: object
      description: One shape for every sign-in step; ``status`` says what the client
        does next.
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        handoff:
          $ref: '#/components/schemas/Handoff'
        choice_token:
          type: string
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantChoice'
        mfa_token:
          type: string
        enrolment_token:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
          description: Shown once, right after set-up.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/RetailerAccountChoice'
      required:
      - status
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        full_name:
          type: string
        preferred_language:
          type: string
        tenant:
          allOf:
          - $ref: '#/components/schemas/MeTenant'
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/MeRole'
          nullable: true
        retailer:
          allOf:
          - $ref: '#/components/schemas/MeRetailer'
          nullable: true
        permissions:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties:
            type: boolean
        impersonation:
          allOf:
          - $ref: '#/components/schemas/MeImpersonation'
          nullable: true
        mfa_enabled:
          type: boolean
        mfa_required:
          type: boolean
          description: 2FA can't be turned off for this account.
      required:
      - email
      - features
      - full_name
      - id
      - impersonation
      - mfa_enabled
      - mfa_required
      - permissions
      - phone
      - preferred_language
      - retailer
      - role
      - tenant
      - user_type
    MeImpersonation:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        impersonator_id:
          type: string
          format: uuid
        mode:
          type: string
      required:
      - impersonator_id
      - mode
      - session_id
    MeRetailer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shop_name:
          type: string
      required:
      - id
      - shop_name
    MeRole:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    MeTenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
      required:
      - id
      - name
      - slug
      - status
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          $ref: '#/components/schemas/StaffUser'
        role:
          $ref: '#/components/schemas/RoleRef'
        is_active:
          type: boolean
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - role
      - user
    Meta:
      type: object
      properties:
        api_version:
          type: string
        environment:
          type: string
        platform_domain:
          type: string
        display_time_zone:
          type: string
      required:
      - api_version
      - display_time_zone
      - environment
      - platform_domain
    MfaSecret:
      type: object
      properties:
        secret:
          type: string
          description: Base32 secret, for manual entry.
        otpauth_uri:
          type: string
          description: Render as a QR code.
      required:
      - otpauth_uri
      - secret
    MfaSetupConfirmInputRequest:
      type: object
      properties:
        setup_token:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
      - setup_token
    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32 secret, for manual entry.
        otpauth_uri:
          type: string
          description: Render as a QR code.
        setup_token:
          type: string
      required:
      - otpauth_uri
      - secret
      - setup_token
    MfaVerifyInputRequest:
      type: object
      properties:
        mfa_token:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          maxLength: 10
        recovery_code:
          type: string
          maxLength: 40
      required:
      - mfa_token
    PaginatedInvitationList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    PaginatedMembershipList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    PasswordAndFactorInputRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          maxLength: 10
        recovery_code:
          type: string
          maxLength: 40
      required:
      - password
    PasswordChangeInputRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - current_password
      - new_password
    PasswordForgotInputRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - email
    PasswordResetInputRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 100
        token:
          type: string
          minLength: 1
          maxLength: 100
        new_password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - new_password
      - token
      - uid
    PatchedMeUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
    PatchedMembershipUpdateRequest:
      type: object
      properties:
        role_code:
          type: string
          minLength: 1
          maxLength: 40
        is_active:
          type: boolean
    Permission:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
        description:
          type: string
      required:
      - code
      - description
      - module
    PreferredLanguageEnum:
      enum:
      - en
      - hi
      - mr
      type: string
      description: |-
        * `en` - English
        * `hi` - हिन्दी
        * `mr` - मराठी
    RecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - recovery_codes
    RefreshInputRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          maxLength: 2000
    RetailerAccountChoice:
      type: object
      description: One of the verified phone owner's distributors (ADR-015).
      properties:
        choice_id:
          type: string
          format: uuid
        distributor_name:
          type: string
        shop_name:
          type: string
      required:
      - choice_id
      - distributor_name
      - shop_name
    RetailerChooseAccountInputRequest:
      type: object
      properties:
        choice_token:
          type: string
          minLength: 1
          maxLength: 200
        choice_id:
          type: string
          format: uuid
      required:
      - choice_id
      - choice_token
    RetailerOtpRequestInputRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - phone
    RetailerOtpRequestResponse:
      type: object
      properties:
        expires_in:
          type: integer
          description: Seconds the code stays valid.
        resend_after:
          type: integer
          description: Seconds before offering 'send again'.
      required:
      - expires_in
      - resend_after
    RetailerOtpVerifyInputRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
      - phone
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 80
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - code
      - id
      - name
      - permissions
    RoleRef:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    StaffLoginInputRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - email
      - password
    StaffUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        mfa_enabled:
          type: boolean
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - email
      - full_name
      - id
      - last_login
      - mfa_enabled
    StatusEnum:
      enum:
      - authenticated
      - handoff
      - choose_tenant
      - choose_account
      - mfa_required
      - mfa_setup_required
      type: string
      description: |-
        * `authenticated` - authenticated
        * `handoff` - handoff
        * `choose_tenant` - choose_tenant
        * `choose_account` - choose_account
        * `mfa_required` - mfa_required
        * `mfa_setup_required` - mfa_setup_required
    TenantChoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - name
      - slug
    TokenResponse:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh:
          type: string
          description: Only when the request sent one.
      required:
      - access
      - access_expires_at
    UserTypeEnum:
      enum:
      - PLATFORM
      - STAFF
      - RETAILER
      type: string
      description: |-
        * `PLATFORM` - Platform
        * `STAFF` - Distributor staff
        * `RETAILER` - Retailer
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
