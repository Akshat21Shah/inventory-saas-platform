name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # >= 32 bytes: it is also the HS256 JWT signing key (RFC 7518 §3.2)
      DJANGO_SECRET_KEY: ci-only-secret-key-for-tests-not-used-anywhere-else
      DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/inventory
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create database roles (same script as docker compose)
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: inventory
        run: sh infra/postgres/init.sh
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Generated API client is up to date
        run: npm run api:generate && git diff --exit-code -- lib/api/generated
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: web
    env:
      ENABLE_DESIGN_SYSTEM: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  # Phase acceptance flows against the real stack (docker compose, as `make up`): super admin,
  # owner invitation through Mailpit, branding, staff invite, shop sign-in with the dev OTP.
  e2e-stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Before the stack starts: the web container's node_modules volume would otherwise create
      # web/node_modules on the host as root.
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start the stack
        run: cp .env.example .env && docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for the API and the web server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/health/ready \
              && curl -fsS -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml ps
          exit 1
      - name: Load demo data
        run: docker compose -f infra/docker-compose.yml exec -T backend python manage.py seed --no-photos
      - name: Acceptance tests
        working-directory: web
        env:
          E2E_FULL_STACK: "1"
          E2E_BASE_URL: http://localhost:3000
        # One at a time: the specs share the super admin, whose 2FA codes are single-use.
        run: npx playwright test --workers=1 e2e/acceptance.spec.ts e2e/catalog-acceptance.spec.ts
      - name: Service logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200 backend worker web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-stack
          path: web/playwright-report

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f infra/backend.Dockerfile --target prod backend
      - name: Build web image
        run: docker build -f infra/web.Dockerfile --target prod web
