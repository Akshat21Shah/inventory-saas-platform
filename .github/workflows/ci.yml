name: CI

# ADR-055 (amended 2026-10-02: Actions minutes are no longer limited): every push runs every
# check once (no second run for a pull request), in parallel jobs for a short wall time: the quick
# checks, Playwright on the production build, the full-stack suites in thirteen jobs (acceptance in
# four groups of specs, the responsive check per width and language), the production images.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to the same branch replaces a running check; main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16  # pgvector (ADR-058)
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # >= 32 bytes: it is also the HS256 JWT signing key (RFC 7518 §3.2)
      DJANGO_SECRET_KEY: ci-only-secret-key-for-tests-not-used-anywhere-else
      DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/inventory
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create database roles (same script as docker compose)
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: inventory
        run: sh infra/postgres/init.sh
      - name: PDF libraries (WeasyPrint) and a font with the rupee sign
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml
      # Both cores (pytest-xdist, a database per worker); the timing targets after, on their own.
      - name: Tests
        run: uv run pytest -n 2 -m "not perf"
      - name: Speed targets
        run: uv run pytest -m perf

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secrets scan reads the whole history
      - name: Secrets scan (gitleaks, every commit on every branch; ADR-055)
        working-directory: .
        run: |
          docker run --rm -v "$PWD":/repo:ro zricethezav/gitleaks:v8.30.1 git /repo \
            --log-opts="--all" --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Generated API client is up to date
        run: npm run api:generate && git diff --exit-code -- lib/api/generated

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Files synced from the web are up to date
        run: npm run check
      - name: Generated API client is up to date
        run: npm run api-client && git diff --exit-code -- lib/api/generated

  mobile-build:
    # A release build of the Android app, signed with the build's own throwaway key (never the
    # upload key: it stays on the release Mac, ADR-061 item 15). Reports the APK's size.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      APP_RELEASE: "1"
      APP_API_URL: https://example.invalid
      APP_PLATFORM_DOMAIN: example.invalid
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --clean
      - name: Release builds are https only (owner, checkpoint review)
        run: |
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          if APP_API_URL=http://example.invalid npx expo config --type public > /dev/null 2>&1; then
            echo "A release build accepted a plain http address" && exit 1
          fi
      - name: Release build (arm64 phones)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: No package with an npm advisory ships inside the app
        run: node scripts/audit-shipped.mjs
      - name: Size
        run: |
          ls -l android/app/build/outputs/apk/release/
          du -k android/app/build/outputs/apk/release/*.apk | awk '{printf "APK: %.1f MB\n", $1/1024}' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      ENABLE_DESIGN_SYSTEM: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Phase acceptance flows and the responsive check (in English, Hindi and Marathi) against the
  # real stack (docker compose), in parallel jobs, each with its own stack: the specs share the super admin, whose 2FA codes are
  # single-use, so a stack runs its specs one at a time.
  e2e-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: acceptance-1
            specs: e2e/acceptance.spec.ts e2e/catalog-acceptance.spec.ts e2e/pricing-tools.spec.ts e2e/inventory-acceptance.spec.ts
          - suite: acceptance-2
            specs: e2e/orders-acceptance.spec.ts e2e/billing-acceptance.spec.ts e2e/notifications-acceptance.spec.ts e2e/selfservice-acceptance.spec.ts
          - suite: acceptance-3
            specs: e2e/compliance-acceptance.spec.ts e2e/reports-acceptance.spec.ts e2e/purchasing-acceptance.spec.ts e2e/growth-acceptance.spec.ts e2e/ai-acceptance.spec.ts
          - suite: responsive-360
            width: 360px
          - suite: responsive-768
            width: 768px
          - suite: responsive-1440
            width: 1440px
          # Languages (ADR-060): a shop orders in Hindi, staff work in Marathi; every screen in
          # Hindi and in Marathi at each width.
          - suite: acceptance-4
            specs: e2e/languages-acceptance.spec.ts
          - suite: responsive-hi-360
            width: 360px
            language: hi
          - suite: responsive-hi-768
            width: 768px
            language: hi
          - suite: responsive-hi-1440
            width: 1440px
            language: hi
          - suite: responsive-mr-360
            width: 360px
            language: mr
          - suite: responsive-mr-768
            width: 768px
            language: mr
          - suite: responsive-mr-1440
            width: 1440px
            language: mr
    name: e2e-stack (${{ matrix.suite }})
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Before the stack starts: the web container's node_modules volume would otherwise create
      # web/node_modules on the host as root.
      - run: npm ci
        working-directory: web
      - id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Backend image (dev target, as docker compose builds it)
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: web_messages=web/messages
          file: infra/backend.Dockerfile
          target: dev
          tags: inventory-backend:ci
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max
      # Built fresh (about 2.5 minutes): exporting its layers to the Actions cache stalled for
      # longer than the build takes.
      - name: Web image (production build)
        uses: docker/build-push-action@v7
        with:
          context: web
          file: infra/web.Dockerfile
          target: prod
          tags: inventory-web:ci
          load: true
          build-args: API_INTERNAL_URL=http://backend:8000
      - name: Start the stack
        run: cp .env.example .env && $COMPOSE up -d
      - name: Wait for the API and the web server
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/health/ready \
              && curl -fsS -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 5
          done
          $COMPOSE ps
          exit 1
      - name: Load demo data
        run: $COMPOSE exec -T backend python manage.py seed --no-photos
      - name: Acceptance tests
        if: matrix.specs
        working-directory: web
        env:
          E2E_FULL_STACK: "1"
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test --workers=1 ${{ matrix.specs }}
      - name: Responsive check (${{ matrix.width }})
        if: matrix.width
        working-directory: web
        env:
          E2E_FULL_STACK: "1"
          E2E_BASE_URL: http://localhost:3000
          E2E_LANGUAGE: ${{ matrix.language || 'en' }}
        run: npx playwright test --workers=1 --project=desktop e2e/responsive.spec.ts -g "every screen at ${{ matrix.width }}"
      - name: Screenshots of every screen at this width
        if: always() && matrix.width
        uses: actions/upload-artifact@v7
        with:
          name: responsive-screenshots-${{ matrix.suite }}
          path: web/test-results/responsive
          if-no-files-found: warn
          retention-days: 7
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --tail=200 backend worker reports-worker web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: web/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: web_messages=web/messages
          file: infra/backend.Dockerfile
          target: prod
          tags: backend-prod
          load: true
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max
      # As a load balancer probes a container: by its address, over plain HTTP, with production
      # settings (host validation and the HTTPS redirect on). Health must answer; nothing else.
      - name: Production backend answers health probes from any host
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-health-check-secret-key-0123456789abcdef \
            -e JWT_SIGNING_KEY=ci-health-check-jwt-key-0123456789abcdef \
            -e FIELD_ENCRYPTION_KEYS="$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e DATABASE_URL=postgres://x@127.0.0.1/x \
            -e PLATFORM_DOMAIN=app.example.com \
            backend-prod uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --no-proxy-headers
          code() { curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.0.3.17:8000' "http://127.0.0.1:8000$1"; }
          for _ in $(seq 1 30); do [ "$(code /health/live)" = 200 ] && break; sleep 2; done
          test "$(code /health/live)" = 200
          test "$(code /api/v1/meta/)" = 400
          for _ in $(seq 1 30); do [ "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy ] && break; sleep 3; done
          docker inspect --format '{{.State.Health.Status}}' api | grep -qx healthy || (docker logs api; exit 1)
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: infra/web.Dockerfile
          target: prod
          build-args: API_INTERNAL_URL=http://backend:8000
