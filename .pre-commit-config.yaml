# The generated API clients are compared byte for byte with a fresh generation in CI.
exclude: ^(web|mobile)/lib/api/generated/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^mobile/patches/  # a patch's blank context lines are a single space
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # syntax only: Compose files use tags such as !reset
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: (^|/)package-lock\.json$  # lock files are large by nature
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      # Secrets scan of the staged changes (ADR-055); `make secrets-scan` checks the whole history.
      - id: gitleaks
        name: secrets scan (gitleaks)
        entry: infra/gitleaks-staged.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: web-lint
        name: web eslint + prettier
        entry: bash -c 'cd web && npx eslint --max-warnings=0 && npx prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false
      - id: mobile-lint
        name: mobile eslint + prettier
        entry: bash -c 'cd mobile && npx eslint --max-warnings=0 && npx prettier --check .'
        language: system
        files: ^mobile/
        pass_filenames: false
